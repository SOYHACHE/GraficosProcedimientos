<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Seguridad Dinámico</title>
    
    <!-- Librerías de Highcharts y Highcharts 3D -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-3d.js"></script>

    <!-- Enlace al archivo CSS externo (si lo guardas separado) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Dashboard de Seguridad</h1>

    <div class="card-config">
        <div class="section-title">Configuración de Datos</div>
        
        <!-- Menú para elegir cuántas columnas/meses crear -->
        <div class="selector-columnas">
            <label for="num-columnas">¿Cuántos periodos/meses deseas mostrar?</label>
            <select id="num-columnas" onchange="generarCamposDinamicos()">
                <option value="1">1 mes</option>
                <option value="2">2 meses</option>
                <option value="3">3 meses</option>
                <option value="4">4 meses</option>
                <option value="5">5 meses</option>
                <option value="6" selected>6 meses</option>
                <option value="7">7 meses</option>
                <option value="8">8 meses</option>
                <option value="9">9 meses</option>
                <option value="10">10 meses</option>
                <option value="11">11 meses</option>
                <option value="12">12 meses</option>
            </select>
        </div>

        <div style="font-size: 11px; font-weight: bold; color: #4a5568; margin-bottom: 5px;">
            Ingresa libremente el nombre del mes/etiqueta, su cantidad y el monto:
        </div>

        <!-- Contenedor dinámico de los inputs generados por JS -->
        <div id="dinamic-inputs-container"></div>

        <div class="btn-update-container">
            <button class="btn-update" onclick="renderizar()">Generar / Actualizar Gráfico</button>
        </div>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="tabs-container">
        <button id="tab-cant" class="tab-btn active" onclick="cambiarModo(false)">Vista: Cantidad de Procedimientos</button>
        <button id="tab-plata" class="tab-btn" onclick="cambiarModo(true)">Vista: Dinero ($)</button>
    </div>

    <!-- Reporte Final y Gráfico -->
    <div id="reporte-final">
        <div class="header-reporte">
            <h2>REPORTE MENSUAL DE SEGURIDAD</h2>
            <p>Resumen Estadístico Personalizado</p>
        </div>
        
        <div class="chart-wrapper">
            <div id="chart-container"></div>
        </div>

        <div class="info-complementaria">
            <h3>Información Complementaria de Gestión:</h3>
            <ul id="lista-resumen"></ul>
        </div>
    </div>
</div>

<!-- Enlace al archivo JavaScript externo (si lo guardas separado) -->
<script src="script.js"></script>

</body>
</html>
